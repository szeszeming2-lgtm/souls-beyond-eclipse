# Roblox toolchain, pinned to exact versions so everyone gets the same tools.
# Install Rokit once (see docs/SETUP.md), then run `rokit install` in this folder.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"          # syncs files on disk into Roblox Studio
wally = "UpliftGames/wally@0.3.2"     # Luau package manager (ProfileStore lives here)
selene = "Kampfkarren/selene@0.32.0"  # Luau linter
stylua = "JohnnyMorganz/StyLua@2.6.0" # Luau formatter
lune = "lune-org/lune@0.10.5"         # runs Luau outside Roblox, for fast logic tests
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1" # Luau type checker (catches Roblox API typos)
