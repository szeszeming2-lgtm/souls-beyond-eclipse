---
# Globals the Lune test runner (tests/run.luau) gives every spec file.
base: luau
name: lune_tests
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  loader:
    any: true
  Shared:
    any: true
  lune:
    any: true
